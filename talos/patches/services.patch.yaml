cluster:
  extraManifests:
    - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
    - https://download.elastic.co/downloads/eck/2.16.1/crds.yaml
    - https://download.elastic.co/downloads/eck/2.16.1/operator.yaml

  # Create namespaces ready for Elastic Deployments 
  inlineManifests:
      - name: namespace-monitoring # Name of the manifest.
        contents: |- # Manifest contents as a string.
          apiVersion: v1
          kind: Namespace
          metadata:
            name: monitoring
      - name: namespace-deployments # Name of the manifest.
        contents: |- # Manifest contents as a string.
          apiVersion: v1
          kind: Namespace
          metadata:
            name: deployments

      # Install Cilium
      - name: cilium-install
        contents: |-
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cilium-install
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-admin
          subjects:
          - kind: ServiceAccount
            name: cilium-install
            namespace: kube-system
          ---
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: cilium-install
            namespace: kube-system
          ---
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: cilium-install
            namespace: kube-system
          spec:
            ttlSecondsAfterFinished: 100
            backoffLimit: 10
            template:
              metadata:
                labels:
                  app: cilium-install
              spec:
                restartPolicy: OnFailure
                tolerations:
                  - operator: Exists
                  - effect: NoSchedule
                    operator: Exists
                  - effect: NoExecute
                    operator: Exists
                  - effect: PreferNoSchedule
                    operator: Exists
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoSchedule
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoExecute
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: PreferNoSchedule
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: node-role.kubernetes.io/control-plane
                              operator: Exists
                serviceAccount: cilium-install
                serviceAccountName: cilium-install
                hostNetwork: true
                containers:
                - name: cilium-install
                  image: quay.io/cilium/cilium-cli:v0.18.3
                  env:
                  - name: KUBERNETES_SERVICE_HOST
                    valueFrom:
                      fieldRef:
                        apiVersion: v1
                        fieldPath: status.podIP
                  - name: KUBERNETES_SERVICE_PORT
                    value: "6443"
                  command:
                    - cilium
                    - install
                    - --set
                    - ipam.mode=kubernetes
                    - --set
                    - kubeProxyReplacement=true
                    - --set
                    - securityContext.capabilities.ciliumAgent={CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}
                    - --set
                    - securityContext.capabilities.cleanCiliumState={NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}
                    - --set
                    - cgroup.autoMount.enabled=false
                    - --set
                    - cgroup.hostRoot=/sys/fs/cgroup
                    - --set
                    - k8sServiceHost=localhost
                    - --set
                    - k8sServicePort=7445
                    - --set
                    - l7Proxy=true 
                    - --set
                    - ingressController.enabled=true
                    - --set
                    - ingressController.enforceHttps=false
                    - --set
                    - ingressController.hostNetwork.enabled=true
                    - --set
                    - ingressController.hostNetwork.nodes.matchLabels.ingress=true
                    - --set
                    - ingressController.loadbalancerMode=dedicated
                    - --set
                    - ingressController.service.type=ClusterIP
                    - --set
                    - ingressController.service.externalTrafficPolicy="~"
                    - --set
                    - ingressController.hostNetwork.sharedListenerPort=443
                    - --set
                    - envoy.enabled=true
                    - --set
                    - envoy.securityContext.capabilities.keepCapNetBindService=true
                    - --set
                    - envoy.securityContext.capabilities.envoy={NET_BIND_SERVICE,NET_ADMIN,SYS_ADMIN}

      # The default gateway for GatewayAPI routes
      # This will redirect any requests on port 80 (HTTP) to port 443 (HTTPs)
      - name: cilium-gateway
        contents: |- 
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: cilium-gateway-eck
            namespace: kube-system
          spec:
            gatewayClassName: cilium
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: All
              - name: https
                port: 443
                protocol: TLS
                tls:
                  mode: Passthrough
                allowedRoutes:
                  namespaces:
                    from: All
          ---
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: http-filter-redirect
            namespace: kube-system
          spec:
            parentRefs:
            - name: cilium-gateway-eck
              namespace: kube-system
              sectionName: http
            rules:
            - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301

      # Local Path Provisioner
      - name: namespace-local-path-storage
        contents: |- 
          apiVersion: v1
          kind: Namespace
          metadata:
            labels:
              pod-security.kubernetes.io/enforce: privileged
            name: local-path-storage
          ---
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
            name: local-path
          provisioner: rancher.io/local-path
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer
          ---
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: local-path-provisioner-service-account
            namespace: local-path-storage
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: local-path-provisioner-role
            namespace: local-path-storage
          rules:
          - apiGroups:
            - ""
            resources:
            - pods
            verbs:
            - get
            - list
            - watch
            - create
            - patch
            - update
            - delete
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: local-path-provisioner-role
          rules:
          - apiGroups:
            - ""
            resources:
            - nodes
            - persistentvolumeclaims
            - configmaps
            - pods
            - pods/log
            verbs:
            - get
            - list
            - watch
          - apiGroups:
            - ""
            resources:
            - persistentvolumes
            verbs:
            - get
            - list
            - watch
            - create
            - patch
            - update
            - delete
          - apiGroups:
            - ""
            resources:
            - events
            verbs:
            - create
            - patch
          - apiGroups:
            - storage.k8s.io
            resources:
            - storageclasses
            verbs:
            - get
            - list
            - watch
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: local-path-provisioner-bind
            namespace: local-path-storage
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: local-path-provisioner-role
          subjects:
          - kind: ServiceAccount
            name: local-path-provisioner-service-account
            namespace: local-path-storage
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: local-path-provisioner-bind
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: local-path-provisioner-role
          subjects:
          - kind: ServiceAccount
            name: local-path-provisioner-service-account
            namespace: local-path-storage
          ---
          apiVersion: v1
          data:
            config.json: |-
              {
                      "nodePathMap":[
                      {
                              "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                              "paths":["/var/local-path-provisioner"]
                      }
                      ]
              }
            helperPod.yaml: |-
              apiVersion: v1
              kind: Pod
              metadata:
                name: helper-pod
              spec:
                priorityClassName: system-node-critical
                tolerations:
                  - key: node.kubernetes.io/disk-pressure
                    operator: Exists
                    effect: NoSchedule
                containers:
                - name: helper-pod
                  image: busybox
                  imagePullPolicy: IfNotPresent
            setup: |-
              #!/bin/sh
              set -eu
              mkdir -m 0777 -p "$VOL_DIR"
            teardown: |-
              #!/bin/sh
              set -eu
              rm -rf "$VOL_DIR"
          kind: ConfigMap
          metadata:
            name: local-path-config
            namespace: local-path-storage
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: local-path-provisioner
            namespace: local-path-storage
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: local-path-provisioner
            template:
              metadata:
                labels:
                  app: local-path-provisioner
              spec:
                containers:
                - command:
                  - local-path-provisioner
                  - --debug
                  - start
                  - --config
                  - /etc/config/config.json
                  env:
                  - name: POD_NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  image: rancher/local-path-provisioner:v0.0.26
                  imagePullPolicy: IfNotPresent
                  name: local-path-provisioner
                  volumeMounts:
                  - mountPath: /etc/config/
                    name: config-volume
                serviceAccountName: local-path-provisioner-service-account
                volumes:
                - configMap:
                    name: local-path-config
                  name: config-volume
